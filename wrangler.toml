name = "node-manager"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# KV Namespace — بعد از ساخت با wrangler kv namespace create CNM_KV این id رو پر کن
[[kv_namespaces]]
binding = "CNM_KV"
id = "REPLACE_WITH_YOUR_KV_ID"

# Durable Objects
[[durable_objects.bindings]]
name = "STATE_DO"
class_name = "StateDO"

[[durable_objects.bindings]]
name = "SESSION_DO"
class_name = "SessionDO"

[[migrations]]
tag = "v1"
new_classes = ["StateDO", "SessionDO"]

[vars]
ADMIN_PASSWORD = "PurplePanel"

# اگه دامنه سفارشی داری، این رو باز کن:
# routes = [
#   { pattern = "your-domain.com/*", custom_domain = true }
# ]
